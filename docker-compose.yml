services:
  api_yumna2:
    image: yumnaapi
    container_name: api_yumna2
    ports:
      - "8098:8000"
    env_file:
      - .env
    networks:
      - bot-network
    restart: no
    volumes:
      - .:/app
    environment:
      - GROQ_API_KEY=${GROQ_API_KEY}
      - TZ=Asia/Jakarta
    command: [
      "gunicorn",
      "-k", "uvicorn.workers.UvicornWorker",
      "--timeout", "120",
      "-w", "1",
      "--bind", "0.0.0.0:8000",
      "--log-level", "info",
      "app.main:app"
    ]

networks:
  bot-network:
    external: true

